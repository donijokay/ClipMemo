name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build ClipMemo.exe
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name ClipMemo `
            --hidden-import customtkinter `
            --hidden-import pystray `
            --hidden-import PIL `
            --hidden-import PIL._tkinter_finder `
            --hidden-import pyperclip `
            --hidden-import pynput `
            --hidden-import keyboard `
            --collect-all customtkinter `
            --collect-all pystray `
            clipmemo_app.py

      - name: Pack zip like AutoHDR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ClipMemo-win | Out-Null
          Copy-Item dist/ClipMemo.exe dist/ClipMemo-win/ClipMemo.exe
          Copy-Item README.md dist/ClipMemo-win/README.md
          Copy-Item LICENSE dist/ClipMemo-win/LICENSE
          Compress-Archive -Path dist/ClipMemo-win/* -DestinationPath dist/ClipMemo.zip -Force

      - name: Upload artifact
              uses: actions/upload-artifact@v4
                      with:
                                name: ClipMemo-windows
                                          path: dist/ClipMemo.zip

                                                - name: Attach to GitHub Release
                                                        if: startsWith(github.ref, 'refs/tags/')
                                                                env:
                                                                          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                                  run: |
                                                                                            gh release upload "${{ github.ref_name }}" dist/ClipMemo.zip --clobber

                                                                                                  - name: Attach to latest release (manual dispatch)
                                                                                                          if: github.event_name == 'workflow_dispatch'
                                                                                                                  env:
                                                                                                                            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                                    run: |
                                                                                                                                              $tag = gh release list --limit 1 --json tagName -q '.[0].tagName'
                                                                                                                                                        if ($tag) {
                                                                                                                                                                    gh release upload $tag dist/ClipMemo.zip --clobber
                                                                                                                                                                              } else {
                                                                                                                                                                                          gh release create v1.0.1 dist/ClipMemo.zip --title "ClipMemo v1.0.1" --notes "Windows exe build (ClipMemo.zip)."
                                                                                                                                                                                                    }
                                                                                                                                                                                                    
