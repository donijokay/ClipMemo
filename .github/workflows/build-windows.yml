name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish ClipMemo (win-x64, framework-dependent)
        run: >
          dotnet publish ClipMemo/ClipMemo.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish

      - name: Pack zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ClipMemo-win/Assets | Out-Null
          Copy-Item publish/ClipMemo.exe dist/ClipMemo-win/ClipMemo.exe
          if (Test-Path publish/Assets) { Copy-Item publish/Assets/* dist/ClipMemo-win/Assets/ -Force }
          elseif (Test-Path ClipMemo/Assets) { Copy-Item ClipMemo/Assets/* dist/ClipMemo-win/Assets/ -Force }
          Copy-Item README.md dist/ClipMemo-win/README.md
          Copy-Item LICENSE dist/ClipMemo-win/LICENSE
          @"
          ClipMemo — how to run
          =====================

          1) Install .NET 8 Desktop Runtime (x64), if you do not have it yet:
             https://dotnet.microsoft.com/download/dotnet/8.0
             (choose "Desktop Runtime" → Windows x64)

          2) Unzip this folder anywhere.

          3) Double-click ClipMemo.exe
             If Windows SmartScreen appears: More info → Run anyway.

          4) Look for the CM icon in the system tray (near the clock).

          Catatan (ID): aplikasi ini framework-dependent (~100 KB).
          Wajib .NET 8 Desktop Runtime. Bukan self-contained.
          "@ | Set-Content -Path dist/ClipMemo-win/INSTALL.txt -Encoding UTF8
          Compress-Archive -Path dist/ClipMemo-win/* -DestinationPath dist/ClipMemo.zip -Force
          Get-ChildItem dist/ClipMemo-win -Recurse | Select-Object FullName, Length
          Get-Item dist/ClipMemo.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipMemo-windows
          path: dist/ClipMemo.zip

      - name: Ensure release exists (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "ClipMemo $tag" --notes "Native C# ClipMemo (framework-dependent win-x64). Requires .NET 8 Desktop Runtime."
          }

      - name: Attach to GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/ClipMemo.zip --clobber

      - name: Attach to latest release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = gh release list --limit 1 --json tagName -q '.[0].tagName'
          if (-not $tag) {
            gh release create v2.0.0 dist/ClipMemo.zip --title "ClipMemo v2.0.0" --notes "Native C# ClipMemo (framework-dependent). Requires .NET 8 Desktop Runtime."
          } else {
            gh release upload $tag dist/ClipMemo.zip --clobber
          }
